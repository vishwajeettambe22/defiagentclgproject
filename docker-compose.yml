# Docker Compose for development — starts PostgreSQL
# Usage: docker compose up -d
version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: defi_user
      POSTGRES_PASSWORD: defi_pass
      POSTGRES_DB: defi_agent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defi_user -d defi_agent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
